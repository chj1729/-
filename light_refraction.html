<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>가상 광학 실험실: 빛의 굴절</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Noto Sans KR', 'sans-serif'] },
                    colors: {
                        medium1: '#1e293b', // 상단 매질 (기본 공기)
                        medium2: '#0f172a', // 하단 매질 (기본 물)
                        laser: '#06b6d4',   // 기본 레이저 (Cyan)
                        tir: '#ef4444',     // 전반사 레이저 (Red)
                    }
                }
            }
        }
    </script>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --main-color: #06b6d4; /* Cyan-500 */
            --bg-color: #020617; /* Slate-950 */
        }
        body {
            background-color: var(--bg-color);
            color: #f8fafc;
            overscroll-behavior: none; /* 드래그 시 브라우저 바운스 방지 */
        }
        /* 글래스모피즘 유틸리티 */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* 스크롤바 숨기기 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        /* 버튼 클릭 애니메이션 */
        .btn-active { transition: transform 0.1s; }
        .btn-active:active { transform: scale(0.95); }
        
        /* 레이저 광선 애니메이션 */
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 5px currentColor); }
            50% { filter: drop-shadow(0 0 15px currentColor); }
        }
        .laser-beam { animation: pulse-glow 2s infinite ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // [필수] 구글 앱스 스크립트 웹앱 URL을 입력하세요
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzif-ltOFHlbk-etuDq-yU3F5JcCmpAtDBeMBOu8d0CQwH7Vzs-_Wzhqn0mNijYdtkH/exec"; 

        // --- 데이터 정의 ---
        const MEDIUMS = {
            air: { name: '공기', n: 1.00, color: '#1e293b' },
            water: { name: '물', n: 1.33, color: '#172554' },
            glass: { name: '유리', n: 1.50, color: '#064e3b' },
            diamond: { name: '다이아몬드', n: 2.42, color: '#4c1d95' }
        };

        const QUIZ_POOL = [
            { id: 1, text: "빛이 한 물질에서 다른 물질로 진행할 때 경계면에서 꺾이는 현상을 굴절이라고 한다.", answer: "O", exp: "물질에 따라 빛의 속력이 달라지기 때문에 꺾이게 됩니다." },
            { id: 2, text: "빛이 공기에서 물로 들어갈 때, 입사각보다 굴절각이 더 크다.", answer: "X", exp: "공기(밀도 낮음)에서 물(밀도 높음)로 갈 때 빛은 법선 쪽으로 꺾여 굴절각이 더 작아집니다." },
            { id: 3, text: "빛이 경계면에 수직(입사각 0도)으로 입사하면 굴절되지 않고 직진한다.", answer: "O", exp: "입사각이 0도이면 꺾이지 않고 그대로 통과합니다." },
            { id: 4, text: "입사각이 커지면 굴절각도 항상 같이 커진다.", answer: "O", exp: "입사각이 증가하면 굴절각도 함께 증가합니다." },
            { id: 5, text: "빛이 공기에서 물로 들어갈 때, 입사각이 0도가 아니면 빛의 경로는 꺾인다.", answer: "O", exp: "수직으로 입사하지 않으면 빛은 속력 차이로 인해 경계면에서 꺾이게 됩니다." },
            { id: 6, text: "빛의 굴절은 물질마다 빛의 진행 속력이 같기 때문에 발생한다.", answer: "X", exp: "물질마다 빛의 진행 속력이 다르기 때문에 굴절이 발생합니다." },
            { id: 7, text: "물 속에 있는 동전이 실제보다 떠 보이는 것은 빛의 반사 때문이다.", answer: "X", exp: "물에서 공기로 나오는 빛이 굴절되어 우리 눈에 들어오기 때문입니다." },
            { id: 8, text: "굴절률이 큰 물질일수록 그 안에서 빛의 속력은 더 느려진다.", answer: "O", exp: "굴절률이 클수록 빛을 더 많이 방해하여 속력이 느려집니다." },
            { id: 9, text: "굴절은 매질의 경계면에서 빛이 반사되기 때문에 나타나는 현상이다.", answer: "X", exp: "굴절은 빛이 반사되는 것이 아니라, 매질을 통과하면서 속력 차이로 인해 진행 방향이 꺾이는 현상입니다." },
            { id: 10, text: "볼록 렌즈로 물체를 확대해서 볼 수 있는 원리는 빛의 굴절을 이용한 것이다.", answer: "O", exp: "렌즈를 통과하는 빛이 굴절되어 초점이 모이거나 퍼지는 원리를 이용합니다." }
        ];

        // --- 아이콘 컴포넌트 (SVG) ---
        const IconSettings = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;

        const App = () => {
            // --- 상태 관리 ---
            const [view, setView] = React.useState('intro'); // 'intro', 'sim', 'report'
            
            // --- 게임 모드 상태 ---
            const [simMode, setSimMode] = React.useState('basic'); // 'basic', 'game'
            const [fishPos, setFishPos] = React.useState({ x: 350, y: 380 });
            const [gameState, setGameState] = React.useState('aiming'); // 'aiming', 'fired', 'hit'
            const [gameAngle, setGameAngle] = React.useState(45);
            const [gameHint, setGameHint] = React.useState('물고기의 과녁(🔴)을 정확히 맞춰보세요!');
            
            // 게임 점수 상태 추가
            const [score, setScore] = React.useState(0);
            const [combo, setCombo] = React.useState(0);
            const [hasEarnedBadge, setHasEarnedBadge] = React.useState(false); // 1000점 뱃지 획득 여부
            
            // 시뮬레이션 상태
            const [m1Key, setM1Key] = React.useState('air');
            const [m2Key, setM2Key] = React.useState('water');
            const [angle1, setAngle1] = React.useState(45); // 입사각 (0 ~ 89)
            
            // 학생 및 결과 상태
            const [studentId, setStudentId] = React.useState('');
            const [studentName, setStudentName] = React.useState('');
            const [learning, setLearning] = React.useState('');
            
            // 퀴즈 상태
            const [quizzes, setQuizzes] = React.useState([]);
            const [quizAnswers, setQuizAnswers] = React.useState([null, null, null]);
            const [quizResult, setQuizResult] = React.useState(null); // 제출 후 피드백용
            
            // UI 상태
            const [alertData, setAlertData] = React.useState(null); // {title, msg, type}
            const [showGuide, setShowGuide] = React.useState(false);
            const [isLoading, setIsLoading] = React.useState(false);

            // --- 캔버스 드래그 인터랙션 상태 ---
            const svgRef = React.useRef(null);
            const [isDragging, setIsDragging] = React.useState(false);

            // --- 물리 엔진 연산 ---
            const n1 = MEDIUMS[m1Key].n;
            const n2 = MEDIUMS[m2Key].n;
            
            // 입사각을 라디안으로 변환
            const rad1 = angle1 * (Math.PI / 180);
            
            // 스넬의 법칙: n1 * sin(θ1) = n2 * sin(θ2)
            // sin(θ2) = (n1 / n2) * sin(θ1)
            const sinTheta2 = (n1 / n2) * Math.sin(rad1);
            
            let angle2 = 0;
            let isTIR = false; // 전반사 여부 (Total Internal Reflection)
            
            if (sinTheta2 > 1 || sinTheta2 < -1) {
                isTIR = true;
                angle2 = angle1; // 전반사 시 반사각 = 입사각
            } else {
                angle2 = Math.asin(sinTheta2) * (180 / Math.PI);
            }

            // --- 헬퍼 함수 ---
            const showAlert = (title, msg, type='info') => setAlertData({ title, msg, type });
            const closeAlert = () => setAlertData(null);

            // 1000점 달성 감지
            React.useEffect(() => {
                if (score >= 1000 && !hasEarnedBadge) {
                    setHasEarnedBadge(true);
                    showAlert(
                        "🌟 광학 마스터 등극!", 
                        "목표 점수 1000점을 돌파하여 '빛의 굴절 마스터' 뱃지를 획득했습니다!\n굴절의 원리를 완벽하게 이해하셨네요.\n\n이제 하단의 [실험 완료 및 결과 작성] 버튼을 눌러 실험을 마무리해 보세요.", 
                        "success"
                    );
                }
            }, [score, hasEarnedBadge]);

            // --- 캔버스 드래그 (Pointer Events) ---
            const updateAngleFromEvent = React.useCallback((e) => {
                // 게임 모드에서 발사 후에는 조작 불가
                if (simMode === 'game' && gameState !== 'aiming') return;

                const svg = svgRef.current;
                if (!svg) return;

                let pt = svg.createSVGPoint();
                pt.x = e.clientX;
                pt.y = e.clientY;

                let cursorPoint;
                try {
                    cursorPoint = pt.matrixTransform(svg.getScreenCTM().inverse());
                } catch(err) {
                    return;
                }

                // 중심점 (250, 250)
                let dx = 250 - cursorPoint.x;
                let dy = 250 - cursorPoint.y;

                // y축 깊이 제한 (수평선 이하로 내려가지 않도록)
                if (dy < 10) dy = 10;
                // 오른쪽 영역 터치 시 0도(수직)로 고정
                if (dx < 0) dx = 0;

                let newAngle = Math.atan2(dx, dy) * (180 / Math.PI);
                newAngle = Math.max(0, Math.min(89.9, newAngle));
                newAngle = Math.round(newAngle * 10) / 10; // 소수점 첫째자리

                if (simMode === 'basic') {
                    setAngle1(newAngle);
                } else {
                    newAngle = Math.min(80, newAngle); // 게임 모드는 최대 80도 제한
                    setGameAngle(newAngle);
                }
            }, [simMode, gameState]);

            const handlePointerDown = (e) => {
                if (simMode === 'game' && gameState !== 'aiming') return;
                setIsDragging(true);
                e.currentTarget.setPointerCapture(e.pointerId);
                updateAngleFromEvent(e);
            };

            const handlePointerMove = (e) => {
                if (!isDragging) return;
                updateAngleFromEvent(e);
            };

            const handlePointerUp = (e) => {
                setIsDragging(false);
                e.currentTarget.releasePointerCapture(e.pointerId);
            };

            // --- 물고기 게임 로직 ---
            const spawnFish = () => {
                const targetTheta2 = (25 + Math.random() * 20) * (Math.PI / 180); // 25~45도 (굴절 차이 극대화)
                const depth = 140 + Math.random() * 50; // 140~190 깊이
                setFishPos({ x: 250 + depth * Math.tan(targetTheta2), y: 250 + depth });
                setGameState('aiming');
                setGameAngle(45.0);
                setGameHint('물고기의 과녁(🔴)을 정확히 맞춰보세요!');
            };

            // 모드 변경 시 물고기 초기화
            React.useEffect(() => {
                if (simMode === 'game') spawnFish();
            }, [simMode]);

            const fireLaser = () => {
                const gameRad1 = gameAngle * (Math.PI / 180);
                const gameSinTheta2 = (1.00 / 1.33) * Math.sin(gameRad1);
                const gameRad2 = Math.asin(gameSinTheta2);
                const dx = fishPos.x - 250;
                const dy = fishPos.y - 250;
                // 직선 방정식과 점 사이의 거리
                const dist = Math.abs(dx * Math.cos(gameRad2) - dy * Math.sin(gameRad2));
                const isForward = dx * Math.sin(gameRad2) + dy * Math.cos(gameRad2) > 0;
                
                if (isForward && dist < 10) { // 과녁 중심점 기준 반경 10 이내
                    setGameState('hit');
                    const earnedPoints = 100 + (combo * 20); // 콤보 보너스
                    setScore(prev => prev + earnedPoints);
                    setCombo(prev => prev + 1);
                    setGameHint(`🎉 명중! (+${earnedPoints}점) ${combo > 0 ? `| 🔥 ${combo+1}연속 콤보!` : ''}`);
                    
                    setTimeout(() => {
                        spawnFish();
                    }, 2000);
                } else {
                    setGameState('fired');
                    setCombo(0); // 콤보 초기화
                    setScore(prev => Math.max(0, prev - 10)); // 감점
                    
                    const targetTheta2 = Math.atan2(dx, dy); // 실제 물고기가 있는 각도
                    let hintMsg = "앗, 빗나갔어요! (-10점)";
                    
                    if (Math.abs(gameRad2 - targetTheta2) < 0.03) {
                        hintMsg = "거의 다 맞았어요! 각도를 1~2도만 미세하게 조절하세요.";
                    } else if (gameRad2 < targetTheta2) {
                        hintMsg = "물고기 왼쪽으로 빗나갔습니다. 입사각을 키워보세요.";
                    } else {
                        hintMsg = "물고기 오른쪽으로 빗나갔습니다. 입사각을 줄여보세요.";
                    }
                    
                    setGameHint(hintMsg);

                    setTimeout(() => {
                        setGameState(prev => prev === 'fired' ? 'aiming' : prev);
                    }, 1500);
                }
            };

            const startSimulation = () => setView('sim');
            
            const goReport = () => {
                // 퀴즈 랜덤 추출 (3개)
                const shuffled = [...QUIZ_POOL].sort(() => 0.5 - Math.random());
                setQuizzes(shuffled.slice(0, 3));
                setQuizAnswers([null, null, null]);
                setQuizResult(null);
                setView('report');
            };

            const handleQuizSelect = (index, selection) => {
                const newAnswers = [...quizAnswers];
                newAnswers[index] = selection;
                setQuizAnswers(newAnswers);
            };

            const submitData = async () => {
                if (!studentId || !studentName) {
                    showAlert("입력 오류", "학번과 이름을 모두 입력해주세요.", "error");
                    return;
                }
                if (quizAnswers.includes(null)) {
                    showAlert("입력 오류", "모든 OX 퀴즈를 풀어주세요.", "error");
                    return;
                }
                if (!learning || learning.trim().length < 10) {
                    showAlert("입력 오류", "실험을 통해 알게 된 점을 10자 이상 성의있게 작성해주세요.", "error");
                    return;
                }

                // 퀴즈 채점 (변수명을 finalQuizScore로 변경하여 게임 score와 충돌 방지)
                let finalQuizScore = 0;
                quizzes.forEach((q, idx) => {
                    if (q.answer === quizAnswers[idx]) finalQuizScore += 33.3;
                });
                finalQuizScore = Math.round(finalQuizScore);

                // 결과 상태 저장 (모달 표시용)
                const resultsInfo = quizzes.map((q, idx) => ({
                    correct: q.answer === quizAnswers[idx],
                    exp: q.exp
                }));
                setQuizResult({ score: finalQuizScore, details: resultsInfo });

                if (!GOOGLE_SCRIPT_URL) {
                    showAlert("테스트 제출 성공", `제출 기능은 설정되지 않았습니다.\n(퀴즈: ${finalQuizScore}점 / 게임: ${score}점)\n\n교사 가이드를 참고하여 구글 시트를 연동하세요.`, "success");
                    return;
                }

                setIsLoading(true);
                try {
                    const payload = {
                        studentId,
                        studentName,
                        experiment: "빛의 굴절",
                        setting: `매질1(${MEDIUMS[m1Key].name}) -> 매질2(${MEDIUMS[m2Key].name})`,
                        resultData: `입사각 ${angle1}도 -> ${isTIR ? '전반사' : `굴절각 ${angle2.toFixed(1)}도`}`,
                        quizScore: finalQuizScore,
                        gameScore: score, // 게임 점수 데이터 추가
                        learningText: learning
                    };

                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    showAlert("제출 완료!", `실험 결과가 성공적으로 기록되었습니다.\n퀴즈: ${finalQuizScore}점 / 게임: ${score}점`, "success");
                    
                } catch (error) {
                    showAlert("제출 실패", "네트워크 오류가 발생했습니다. 다시 시도해주세요.", "error");
                } finally {
                    setIsLoading(false);
                }
            };

            // --- 렌더링 영역 ---
            
            // SVG 도해용 변수 계산
            const cx = 250; // 중심 x
            const cy = 250; // 중심 y
            
            // [업데이트] 발사장치 위치 거리(캔버스 내부)와 실제 빛의 길이 분리
            const emitterDist = 200; // 발사장치가 중심에서 떨어져 있는 거리 (캔버스 500x500 내부에 위치)
            const rayLen = 600;      // 뻗어나가는 레이저 광선의 길이 (화면 끝까지)
            
            // --- 기본 모드 계산 ---
            const startX = cx - emitterDist * Math.sin(rad1);
            const startY = cy - emitterDist * Math.cos(rad1);

            let endX, endY, rayColor;
            if (isTIR) {
                const radRefl = angle1 * (Math.PI / 180);
                endX = cx + rayLen * Math.sin(radRefl);
                endY = cy - rayLen * Math.cos(radRefl);
                rayColor = "text-red-500";
            } else {
                const rad2 = angle2 * (Math.PI / 180);
                endX = cx + rayLen * Math.sin(rad2);
                endY = cy + rayLen * Math.cos(rad2);
                rayColor = "text-cyan-400";
            }

            // --- 게임 모드 계산 ---
            const gameRad1 = gameAngle * (Math.PI / 180);
            const gameSinTheta2 = (1.00 / 1.33) * Math.sin(gameRad1);
            const gameRad2 = Math.asin(gameSinTheta2);
            
            const gStartX = cx - emitterDist * Math.sin(gameRad1);
            const gStartY = cy - emitterDist * Math.cos(gameRad1);
            
            // 발사 시 굴절선
            const gEndX_refr = cx + rayLen * Math.sin(gameRad2);
            const gEndY_refr = cy + rayLen * Math.cos(gameRad2);
            
            // 조준선 (직진할 경우)
            const gEndX_straight = cx + rayLen * Math.sin(gameRad1);
            const gEndY_straight = cy + rayLen * Math.cos(gameRad1);
            
            // 겉보기 위치 (수직 깊이가 굴절률에 반비례하여 얕아보임)
            const apparentDepth = (fishPos.y - 250) / 1.33;
            const apparentY = 250 + apparentDepth;
            const apparentFishPos = { x: fishPos.x, y: apparentY };

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* 상단 네비게이션 */}
                    <header className="p-4 flex justify-between items-center z-10 glass-panel border-b-0 border-slate-700">
                        <h1 className="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">
                            ✨ 가상 광학 실험실
                        </h1>
                        <button 
                            onClick={() => setShowGuide(true)}
                            className="btn-active flex items-center gap-2 text-sm md:text-base bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg border border-slate-600 transition-colors"
                        >
                            <IconSettings /> <span className="hidden sm:inline">교사 가이드</span>
                        </button>
                    </header>

                    {/* 메인 컨텐츠 영역 */}
                    <main className="flex-grow flex items-center justify-center p-4">
                        <div className="w-full max-w-5xl">
                            
                            {/* --- STEP 1: INTRO --- */}
                            {view === 'intro' && (
                                <div className="glass-panel rounded-3xl p-8 md:p-12 text-center shadow-2xl mx-auto max-w-2xl transform transition-all">
                                    <div className="w-20 h-20 mx-auto mb-6 bg-cyan-500/20 rounded-full flex items-center justify-center border border-cyan-500/50">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                                    </div>
                                    <h2 className="text-3xl md:text-4xl font-extrabold mb-4 text-white">빛의 굴절 관찰하기</h2>
                                    <p className="text-slate-300 mb-8 text-lg leading-relaxed">
                                        빛이 서로 다른 두 물질의 경계면을 지날 때 왜 꺾일까요?<br/>
                                        입사각을 조절해보고, 물질을 바꿔가며 빛의 신비한 경로를 직접 확인해 보세요!
                                    </p>
                                    <div className="bg-slate-800/50 rounded-xl p-4 mb-8 text-left border border-slate-700">
                                        <h3 className="font-bold text-cyan-400 mb-2">🎯 실험 미션</h3>
                                        <ul className="list-disc list-inside text-slate-300 space-y-1 text-sm md:text-base">
                                            <li>입사각이 커질 때 굴절각은 어떻게 변하는지 관찰하기</li>
                                            <li>공기에서 물, 물에서 공기로 갈 때 빛이 어느 쪽으로 꺾이는지 비교하기</li>
                                            <li>'전반사' 현상이 일어나는 조건 찾아보기</li>
                                        </ul>
                                    </div>
                                    <button 
                                        onClick={startSimulation}
                                        className="btn-active w-full sm:w-auto bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-4 px-12 rounded-full shadow-[0_0_20px_rgba(6,182,212,0.4)] text-lg"
                                    >
                                        실험실 입장하기
                                    </button>
                                    <p className="mt-8 text-xs text-slate-500">Created by Yang DH</p>
                                </div>
                            )}

                            {/* --- STEP 2: SIMULATION --- */}
                            {view === 'sim' && (
                                <div className="flex flex-col lg:flex-row gap-6">
                                    {/* 조작 패널 */}
                                    <div className="lg:w-1/3 glass-panel rounded-2xl p-6 shadow-xl flex flex-col gap-6 h-fit order-2 lg:order-1">
                                        
                                        {/* 모드 탭 */}
                                        <div className="flex bg-slate-800 p-1 rounded-xl">
                                            <button 
                                                onClick={() => setSimMode('basic')}
                                                className={`flex-1 py-2 rounded-lg text-sm font-bold transition-colors ${simMode === 'basic' ? 'bg-cyan-500 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                                            >기본 실험</button>
                                            <button 
                                                onClick={() => setSimMode('game')}
                                                className={`flex-1 py-2 rounded-lg text-sm font-bold transition-colors ${simMode === 'game' ? 'bg-cyan-500 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                                            >🐟 물고기 잡기</button>
                                        </div>

                                        {simMode === 'basic' ? (
                                            <>
                                                <div>
                                                    <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                                        <span className="bg-cyan-500 w-2 h-6 rounded-sm inline-block"></span>
                                                        실험 조건 설정
                                                    </h3>
                                                    
                                                    {/* 최우선 조작: 입사각 슬라이더 */}
                                                    <div className="bg-slate-800/80 p-4 rounded-xl border border-slate-600 mb-4">
                                                        <div className="flex justify-between mb-2">
                                                            <label className="text-sm font-bold text-white flex items-center gap-2">
                                                                입사각 조절
                                                                <span className="text-xs font-normal text-cyan-300 animate-pulse">💡 캔버스를 직접 드래그 해보세요!</span>
                                                            </label>
                                                            <span className="text-cyan-400 font-mono font-bold">{angle1}°</span>
                                                        </div>
                                                        <input 
                                                            type="range" 
                                                            min="0" max="89" step="0.1" value={angle1} 
                                                            onChange={(e) => setAngle1(Number(e.target.value))}
                                                            className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500"
                                                        />
                                                    </div>

                                                    {/* 결과 수치 패널 */}
                                                    <div className={`p-4 rounded-xl border mb-4 ${isTIR ? 'bg-red-900/20 border-red-500/50' : 'bg-cyan-900/20 border-cyan-500/50'}`}>
                                                        <h4 className="text-sm text-slate-300 mb-2">현재 상태 결과</h4>
                                                        {isTIR ? (
                                                            <div>
                                                                <div className="text-2xl font-bold text-red-400 mb-1 animate-pulse">전반사 발생!</div>
                                                                <div className="text-sm text-red-200">빛이 굴절하지 못하고 100% 반사됩니다. (반사각: {angle2}°)</div>
                                                            </div>
                                                        ) : (
                                                            <div className="flex justify-between items-end">
                                                                <span className="text-slate-400">굴절각</span>
                                                                <span className="text-3xl font-mono font-bold text-cyan-400">{angle2.toFixed(1)}°</span>
                                                            </div>
                                                        )}
                                                    </div>

                                                    <div className="space-y-4">
                                                        {/* 매질 1 선택 */}
                                                        <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-600">
                                                            <label className="block text-sm text-slate-400 mb-1">위쪽 물질 (매질 1)</label>
                                                            <select 
                                                                value={m1Key} 
                                                                onChange={(e) => setM1Key(e.target.value)}
                                                                className="w-full bg-slate-900 text-white border border-slate-600 rounded-lg p-2 outline-none focus:border-cyan-500"
                                                            >
                                                                {Object.entries(MEDIUMS).map(([k, v]) => (
                                                                    <option key={k} value={k}>{v.name} (굴절률: {v.n})</option>
                                                                ))}
                                                            </select>
                                                        </div>

                                                        {/* 매질 2 선택 */}
                                                        <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-600">
                                                            <label className="block text-sm text-slate-400 mb-1">아래쪽 물질 (매질 2)</label>
                                                            <select 
                                                                value={m2Key} 
                                                                onChange={(e) => setM2Key(e.target.value)}
                                                                className="w-full bg-slate-900 text-white border border-slate-600 rounded-lg p-2 outline-none focus:border-cyan-500"
                                                            >
                                                                {Object.entries(MEDIUMS).map(([k, v]) => (
                                                                    <option key={k} value={k}>{v.name} (굴절률: {v.n})</option>
                                                                ))}
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div>
                                            </>
                                        ) : (
                                            <>
                                                <div>
                                                    <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                                        <span className="bg-red-500 w-2 h-6 rounded-sm inline-block"></span>
                                                        미션: 물고기 잡기
                                                    </h3>
                                                    
                                                    {/* 슬라이더 패널을 최상단으로 이동 */}
                                                    <div className="bg-slate-800/80 px-4 py-5 rounded-xl border border-slate-600 mb-3">
                                                        <div className="flex justify-between mb-3">
                                                            <label className="text-sm font-bold text-white flex flex-col sm:flex-row gap-1">
                                                                레이저 조준각
                                                                <span className="text-xs font-normal text-red-300 animate-pulse">💡 캔버스를 직접 드래그 해보세요!</span>
                                                            </label>
                                                            <span className="text-red-400 font-mono font-bold">{gameAngle.toFixed(1)}°</span>
                                                        </div>
                                                        <input 
                                                            type="range" 
                                                            min="0" max="80" step="0.1" value={gameAngle} 
                                                            onChange={(e) => setGameAngle(Number(e.target.value))}
                                                            disabled={gameState !== 'aiming'}
                                                            className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500 disabled:opacity-50"
                                                        />
                                                    </div>

                                                    <button 
                                                        onClick={fireLaser}
                                                        disabled={gameState !== 'aiming'}
                                                        className="btn-active w-full bg-red-500 hover:bg-red-400 disabled:bg-slate-600 text-white font-bold py-3 rounded-xl shadow-lg transition-colors mb-3"
                                                    >
                                                        {gameState === 'aiming' ? '🎯 발사!' : (gameState === 'hit' ? '🎉 명중!' : '앗, 빗나갔어요!')}
                                                    </button>
                                                    
                                                    <p className={`text-sm mb-3 font-bold h-10 flex items-center ${gameState === 'hit' ? 'text-green-400' : 'text-amber-400'}`}>
                                                        💡 {gameHint}
                                                    </p>
                                                    
                                                    {/* 점수판 */}
                                                    <div className="flex flex-col bg-slate-900 border border-slate-700 p-3 rounded-xl mb-3 shadow-inner relative overflow-hidden">
                                                        {hasEarnedBadge && <div className="absolute inset-0 bg-gradient-to-r from-transparent via-yellow-500/20 to-transparent animate-[pulse_2s_infinite]"></div>}
                                                        
                                                        <div className="flex justify-between items-end mb-1 z-10">
                                                            <div className="text-slate-300 font-bold">
                                                                점수: <span className={`text-3xl font-mono ml-2 ${hasEarnedBadge ? 'text-yellow-400' : 'text-cyan-400'}`}>{score}</span><span className="text-sm ml-1">점</span>
                                                            </div>
                                                            <div className="text-right text-xs text-slate-400 font-bold">
                                                                목표: 1000점
                                                            </div>
                                                        </div>
                                                        
                                                        <div className="w-full h-2 bg-slate-800 rounded-full mt-1 z-10">
                                                            <div 
                                                                className={`h-full rounded-full transition-all duration-500 ${hasEarnedBadge ? 'bg-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.5)]' : 'bg-cyan-500'}`} 
                                                                style={{ width: `${Math.min(100, (score / 1000) * 100)}%` }}
                                                            ></div>
                                                        </div>

                                                        <div className="absolute top-3 right-3 z-10">
                                                            {combo > 1 && <div className="text-orange-400 font-bold text-sm animate-pulse">🔥 {combo} COMBO!</div>}
                                                            {hasEarnedBadge && combo <= 1 && <div className="text-yellow-400 font-bold text-sm">🌟 마스터 뱃지</div>}
                                                        </div>
                                                    </div>

                                                    <button 
                                                        onClick={spawnFish}
                                                        className="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-bold py-2 rounded-xl transition-colors mb-3"
                                                    >
                                                        🔄 물고기 위치 바꾸기
                                                    </button>
                                                    
                                                    <p className="text-sm text-slate-400 leading-relaxed bg-slate-800/50 p-3 rounded-lg">
                                                        <span className="text-red-400 font-bold">※ 규칙:</span> 진하게 보이는 위치(허상)에 속지 말고, 희미한 실제 물고기의 <span className="text-red-400 font-bold">빨간 점(🔴)</span>을 정확히 맞추세요!
                                                    </p>
                                                </div>
                                            </>
                                        )}

                                        <button 
                                            onClick={goReport}
                                            className="btn-active w-full mt-auto bg-white text-slate-900 font-bold py-3 rounded-xl hover:bg-slate-200 shadow-lg"
                                        >
                                            실험 완료 및 결과 작성 ➜
                                        </button>
                                    </div>

                                    {/* SVG 캔버스 영역 (터치/드래그 이벤트 바인딩) */}
                                    <div className="lg:w-2/3 glass-panel rounded-2xl overflow-hidden shadow-2xl border-slate-600 relative order-1 lg:order-2">
                                        <svg 
                                            ref={svgRef}
                                            viewBox="0 0 500 500" 
                                            className={`w-full h-full max-h-[50vh] lg:max-h-[80vh] bg-black block touch-none ${(simMode === 'game' && gameState !== 'aiming') ? 'cursor-not-allowed' : 'cursor-crosshair'}`}
                                            style={{filter: 'drop-shadow(0 0 20px rgba(0,0,0,0.5))'}}
                                            onPointerDown={handlePointerDown}
                                            onPointerMove={handlePointerMove}
                                            onPointerUp={handlePointerUp}
                                            onPointerCancel={handlePointerUp}
                                            onPointerLeave={handlePointerUp}
                                        >
                                            <defs>
                                                <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
                                                    <feGaussianBlur stdDeviation="4" result="blur" />
                                                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                                                </filter>
                                                <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
                                                    <feGaussianBlur stdDeviation="6" result="blur" />
                                                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                                                </filter>
                                                <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
                                                    <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>
                                                </pattern>
                                            </defs>

                                            {/* 배경 매질 */}
                                            <rect x="0" y="0" width="500" height="250" fill={simMode === 'game' ? MEDIUMS['air'].color : MEDIUMS[m1Key].color} className="transition-colors duration-500" />
                                            <rect x="0" y="250" width="500" height="250" fill={simMode === 'game' ? MEDIUMS['water'].color : MEDIUMS[m2Key].color} className="transition-colors duration-500" />
                                            
                                            {/* 배경 그리드 */}
                                            <rect width="500" height="500" fill="url(#grid)" />

                                            {simMode === 'basic' ? (
                                                <>
                                                    {/* 매질 라벨 */}
                                                    <text x="20" y="30" fill="rgba(255,255,255,0.7)" fontSize="16" fontWeight="bold">{MEDIUMS[m1Key].name}</text>
                                                    <text x="20" y="280" fill="rgba(255,255,255,0.7)" fontSize="16" fontWeight="bold">{MEDIUMS[m2Key].name}</text>

                                                    {/* 중심축 (법선과 경계면) */}
                                                    <line x1="0" y1="250" x2="500" y2="250" stroke="rgba(255,255,255,0.5)" strokeWidth="2" />
                                                    <line x1="250" y1="0" x2="250" y2="500" stroke="rgba(255,255,255,0.3)" strokeWidth="2" strokeDasharray="10,10" />

                                                    {/* 반원 가이드 (각도기 모양) */}
                                                    <circle cx="250" cy="250" r="150" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="1" />
                                                    <circle cx="250" cy="250" r="100" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="1" />

                                                    {/* 입사각 호 그리기 */}
                                                    {angle1 > 5 && (
                                                        <path d={`M 250 150 A 100 100 0 0 0 ${250 - 100*Math.sin(rad1)} ${250 - 100*Math.cos(rad1)}`} fill="none" stroke="rgba(255,255,255,0.5)" strokeWidth="2" />
                                                    )}
                                                    
                                                    {/* 굴절/반사각 호 그리기 */}
                                                    {!isTIR && angle2 > 5 && (
                                                        <path d={`M 250 350 A 100 100 0 0 0 ${250 + 100*Math.sin(angle2*Math.PI/180)} ${250 + 100*Math.cos(angle2*Math.PI/180)}`} fill="none" stroke="rgba(6,182,212,0.5)" strokeWidth="2" />
                                                    )}

                                                    {/* 레이저 발사장치 (디자인 업그레이드) */}
                                                    <g transform={`translate(${startX}, ${startY}) rotate(${-angle1})`} className="cursor-grab active:cursor-grabbing">
                                                        {/* 본체 */}
                                                        <rect x="-14" y="-45" width="28" height="32" rx="4" fill="#1e293b" stroke="#475569" strokeWidth="2" />
                                                        {/* 본체 그립(미끄럼 방지 줄무늬) */}
                                                        <line x1="-6" y1="-35" x2="-6" y2="-20" stroke="#0f172a" strokeWidth="3" strokeLinecap="round" />
                                                        <line x1="0" y1="-35" x2="0" y2="-20" stroke="#0f172a" strokeWidth="3" strokeLinecap="round" />
                                                        <line x1="6" y1="-35" x2="6" y2="-20" stroke="#0f172a" strokeWidth="3" strokeLinecap="round" />
                                                        {/* 총구 연결부 */}
                                                        <path d="M -10 -13 L 10 -13 L 6 -5 L -6 -5 Z" fill="#334155" stroke="#64748b" strokeWidth="1" />
                                                        {/* 뾰족한 노즐 팁 */}
                                                        <path d="M -5 -5 L 5 -5 L 3 0 L -3 0 Z" fill="#94a3b8" />
                                                        {/* 레이저 발광 포인트 */}
                                                        <circle cx="0" cy="0" r="4" fill="#06b6d4" filter="url(#glowCyan)" />
                                                        {/* 처음 사용자를 위한 드래그 힌트 애니메이션 */}
                                                        {!isDragging && angle1 === 45 && (
                                                            <circle cx="0" cy="0" r="24" fill="none" stroke="rgba(6,182,212,0.8)" strokeWidth="2" className="animate-ping" />
                                                        )}
                                                    </g>

                                                    {/* 레이저 광선 (입사) */}
                                                    <line x1={startX} y1={startY} x2={cx} y2={cy} stroke="#06b6d4" strokeWidth="4" className="laser-beam text-cyan-400" filter="url(#glowCyan)" strokeLinecap="round" />
                                                    
                                                    {/* 레이저 광선 (굴절 또는 반사) */}
                                                    <line 
                                                        x1={cx} y1={cy} 
                                                        x2={endX} y2={endY} 
                                                        stroke={isTIR ? "#ef4444" : "#06b6d4"} 
                                                        strokeWidth="4" 
                                                        className={`laser-beam ${rayColor}`} 
                                                        filter={isTIR ? "url(#glowRed)" : "url(#glowCyan)"} 
                                                        strokeLinecap="round" 
                                                    />

                                                    {/* 텍스트 라벨 (가운데 겹치지 않게 약간 오프셋) */}
                                                    <text x={250 - 80*Math.sin(rad1/2)} y={250 - 80*Math.cos(rad1/2) - 10} fill="white" fontSize="14" textAnchor="middle">입사각</text>
                                                    
                                                    {isTIR ? (
                                                        <text x={250 + 80*Math.sin(rad1/2)} y={250 - 80*Math.cos(rad1/2) - 10} fill="#fca5a5" fontSize="14" textAnchor="middle">반사각</text>
                                                    ) : (
                                                        <text x={250 + 80*Math.sin(angle2*Math.PI/180/2)} y={250 + 80*Math.cos(angle2*Math.PI/180/2) + 20} fill="#67e8f9" fontSize="14" textAnchor="middle">굴절각</text>
                                                    )}
                                                </>
                                            ) : (
                                                <>
                                                    {/* 겉보기 위치 (허상) */}
                                                    <g opacity={gameState === 'aiming' ? "1" : "0.4"}>
                                                        <text x={apparentFishPos.x} y={apparentFishPos.y} fontSize="32" textAnchor="middle" dominantBaseline="middle">🐟</text>
                                                        <text x={apparentFishPos.x + 25} y={apparentFishPos.y} fill="#94a3b8" fontSize="12" dominantBaseline="middle" fontWeight="bold">👀 보이는 위치</text>
                                                    </g>

                                                    {/* 실제 물고기 위치 */}
                                                    <g opacity={gameState === 'hit' ? "1" : "0.2"}>
                                                        <text x={fishPos.x} y={fishPos.y} fontSize="32" textAnchor="middle" dominantBaseline="middle" className={gameState === 'hit' ? 'animate-bounce' : ''}>🐟</text>
                                                        <text x={fishPos.x + 25} y={fishPos.y} fill="#fca5a5" fontSize="12" dominantBaseline="middle">🎯 실제 위치</text>
                                                    </g>

                                                    {/* 우기기 방지용 정밀 타겟 (과녁) */}
                                                    <circle cx={fishPos.x} cy={fishPos.y} r="4" fill="#ef4444" className={gameState === 'hit' ? 'animate-ping' : ''} />
                                                    <circle cx={fishPos.x} cy={fishPos.y} r="8" fill="none" stroke="#ef4444" strokeWidth="1" strokeDasharray="2,2" opacity="0.7" />

                                                    {/* 조준선 (공기 중 입사 광선) */}
                                                    <line x1={gStartX} y1={gStartY} x2={cx} y2={cy} stroke="#ef4444" strokeWidth="4" strokeLinecap="round" />
                                                    
                                                    {/* 레이저 발사장치 (디자인 업그레이드) */}
                                                    <g transform={`translate(${gStartX}, ${gStartY}) rotate(${-gameAngle})`} className={gameState === 'aiming' ? "cursor-grab active:cursor-grabbing" : ""}>
                                                        {/* 본체 */}
                                                        <rect x="-14" y="-45" width="28" height="32" rx="4" fill="#1e293b" stroke="#475569" strokeWidth="2" />
                                                        {/* 본체 그립(미끄럼 방지 줄무늬) */}
                                                        <line x1="-6" y1="-35" x2="-6" y2="-20" stroke="#0f172a" strokeWidth="3" strokeLinecap="round" />
                                                        <line x1="0" y1="-35" x2="0" y2="-20" stroke="#0f172a" strokeWidth="3" strokeLinecap="round" />
                                                        <line x1="6" y1="-35" x2="6" y2="-20" stroke="#0f172a" strokeWidth="3" strokeLinecap="round" />
                                                        {/* 총구 연결부 */}
                                                        <path d="M -10 -13 L 10 -13 L 6 -5 L -6 -5 Z" fill="#334155" stroke="#64748b" strokeWidth="1" />
                                                        {/* 뾰족한 노즐 팁 */}
                                                        <path d="M -5 -5 L 5 -5 L 3 0 L -3 0 Z" fill="#94a3b8" />
                                                        {/* 레이저 발광 포인트 */}
                                                        <circle cx="0" cy="0" r="4" fill="#ef4444" filter="url(#glowRed)" />
                                                        {/* 처음 사용자를 위한 드래그 힌트 애니메이션 */}
                                                        {!isDragging && gameAngle === 45 && gameState === 'aiming' && (
                                                            <circle cx="0" cy="0" r="24" fill="none" stroke="rgba(239,68,68,0.8)" strokeWidth="2" className="animate-ping" />
                                                        )}
                                                    </g>

                                                    {/* 항상 조준 가이드선 (직진 경로) 표시 */}
                                                    <line x1={cx} y1={cy} x2={gEndX_straight} y2={gEndY_straight} stroke="#ef4444" strokeWidth="2" strokeDasharray="5,5" opacity="0.4" />
                                                    
                                                    {/* 발사된 레이저 (실제 굴절 경로) */}
                                                    {gameState !== 'aiming' && (
                                                        <line x1={cx} y1={cy} x2={gEndX_refr} y2={gEndY_refr} stroke="#ef4444" strokeWidth="4" className="laser-beam text-red-500" filter="url(#glowRed)" strokeLinecap="round" />
                                                    )}

                                                    {/* 명중 이펙트 */}
                                                    {gameState === 'hit' && (
                                                        <circle cx={fishPos.x} cy={fishPos.y} r="30" fill="none" stroke="#22c55e" strokeWidth="4" className="animate-ping" />
                                                    )}
                                                </>
                                            )}
                                        </svg>
                                    </div>
                                </div>
                            )}

                            {/* --- STEP 3: REPORT --- */}
                            {view === 'report' && (
                                <div className="glass-panel rounded-3xl p-6 md:p-10 shadow-2xl max-w-3xl mx-auto border-t-4 border-t-cyan-500">
                                    <h2 className="text-2xl md:text-3xl font-bold mb-6 text-white flex items-center gap-3">
                                        📝 실험 결과 보고서
                                        <span className="text-sm font-normal bg-slate-700 px-3 py-1 rounded-full">마지막 단계</span>
                                    </h2>

                                    {/* 내 정보 입력 */}
                                    <div className="flex flex-col sm:flex-row gap-4 mb-8 bg-slate-800/50 p-4 rounded-xl border border-slate-600">
                                        <div className="flex-1">
                                            <label className="block text-sm text-slate-400 mb-1">학번 (예: 2101)</label>
                                            <input 
                                                type="number" value={studentId} onChange={e=>setStudentId(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:border-cyan-500 outline-none transition-colors"
                                                placeholder="학번 입력" disabled={quizResult !== null}
                                            />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-sm text-slate-400 mb-1">이름</label>
                                            <input 
                                                type="text" value={studentName} onChange={e=>setStudentName(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:border-cyan-500 outline-none transition-colors"
                                                placeholder="이름 입력" disabled={quizResult !== null}
                                            />
                                        </div>
                                    </div>

                                    {/* 랜덤 OX 퀴즈 */}
                                    <div className="mb-8">
                                        <h3 className="text-lg font-bold text-cyan-400 mb-4">🧠 개념 확인 퀴즈</h3>
                                        <div className="space-y-4">
                                            {quizzes.map((q, idx) => (
                                                <div key={idx} className={`p-4 rounded-xl border ${quizResult ? (quizResult.details[idx].correct ? 'bg-green-900/20 border-green-500/50' : 'bg-red-900/20 border-red-500/50') : 'bg-slate-800 border-slate-600'}`}>
                                                    <p className="text-white mb-3"><span className="font-bold text-cyan-500 mr-2">Q{idx+1}.</span>{q.text}</p>
                                                    
                                                    {/* 선택 버튼 */}
                                                    {!quizResult && (
                                                        <div className="flex gap-2">
                                                            <button 
                                                                onClick={() => handleQuizSelect(idx, 'O')}
                                                                className={`flex-1 py-2 rounded-lg border font-bold transition-colors ${quizAnswers[idx] === 'O' ? 'bg-cyan-600 border-cyan-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'}`}
                                                            >O</button>
                                                            <button 
                                                                onClick={() => handleQuizSelect(idx, 'X')}
                                                                className={`flex-1 py-2 rounded-lg border font-bold transition-colors ${quizAnswers[idx] === 'X' ? 'bg-cyan-600 border-cyan-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'}`}
                                                            >X</button>
                                                        </div>
                                                    )}

                                                    {/* 결과 피드백 */}
                                                    {quizResult && (
                                                        <div className="mt-2 text-sm">
                                                            {quizResult.details[idx].correct ? 
                                                                <span className="text-green-400 font-bold flex items-center gap-1"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg> 정답입니다!</span> : 
                                                                <span className="text-red-400 font-bold flex items-center gap-1"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg> 오답입니다. (정답: {q.answer})</span>
                                                            }
                                                            <p className="text-slate-400 mt-1">{quizResult.details[idx].exp}</p>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 알게 된 점 */}
                                    <div className="mb-8">
                                        <h3 className="text-lg font-bold text-cyan-400 mb-2">💡 실험을 통해 알게 된 점</h3>
                                        <textarea 
                                            value={learning} onChange={e=>setLearning(e.target.value)}
                                            className="w-full h-32 bg-slate-900 border border-slate-600 rounded-xl p-4 text-white focus:border-cyan-500 outline-none resize-none transition-colors"
                                            placeholder="입사각과 굴절각의 관계, 매질에 따른 꺾임 정도의 변화 등 오늘 실험에서 새롭게 알게 된 내용을 자세히 적어보세요. (최소 10자)"
                                            disabled={quizResult !== null}
                                        ></textarea>
                                    </div>

                                    {/* 하단 버튼 */}
                                    <div className="flex gap-4">
                                        <button 
                                            onClick={() => setView('sim')}
                                            className="btn-active flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl transition-colors"
                                        >
                                            돌아가기
                                        </button>
                                        
                                        {!quizResult ? (
                                            <button 
                                                onClick={submitData}
                                                disabled={isLoading}
                                                className="btn-active flex-[2] bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(6,182,212,0.5)] transition-all flex justify-center items-center gap-2"
                                            >
                                                {isLoading ? (
                                                    <><svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 제출 중...</>
                                                ) : "결과 제출하기"}
                                            </button>
                                        ) : (
                                            <button 
                                                onClick={() => {
                                                    setStudentId(''); setStudentName(''); setLearning(''); setView('intro');
                                                }}
                                                className="btn-active flex-[2] bg-white text-slate-900 font-bold py-4 rounded-xl transition-colors"
                                            >
                                                처음으로 (새로고침)
                                            </button>
                                        )}
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* --- 전역 모달 UI (알림용) --- */}
                    {alertData && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                            <div className="bg-slate-800 border border-slate-600 rounded-2xl p-6 w-full max-w-sm shadow-2xl transform scale-100 animate-[pulse_0.1s_ease-out]">
                                <div className={`w-12 h-12 rounded-full flex items-center justify-center mb-4 mx-auto ${alertData.type === 'error' ? 'bg-red-500/20 text-red-500' : 'bg-green-500/20 text-green-500'}`}>
                                    {alertData.type === 'error' ? (
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                    ) : (
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                    )}
                                </div>
                                <h3 className="text-xl font-bold text-white text-center mb-2">{alertData.title}</h3>
                                <p className="text-slate-300 text-center mb-6 whitespace-pre-wrap">{alertData.msg}</p>
                                <button onClick={closeAlert} className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-colors">
                                    확인
                                </button>
                            </div>
                        </div>
                    )}

                    {/* --- 교사 가이드 모달 --- */}
                    {showGuide && (
                        <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl">
                                <div className="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800 rounded-t-2xl">
                                    <h3 className="text-xl font-bold text-cyan-400">⚙️ 구글 시트 연동 가이드 (교사용)</h3>
                                    <button onClick={() => setShowGuide(false)} className="text-slate-400 hover:text-white">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-4 text-sm text-slate-300">
                                    <p>선생님, 이 앱은 학생들의 실험 결과와 퀴즈 점수를 구글 스프레드시트로 자동 수집할 수 있습니다. 아래 단계를 따라주세요.</p>
                                    
                                    <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                        <h4 className="font-bold text-white mb-2">1. 구글 스프레드시트 준비</h4>
                                        <ul className="list-decimal list-inside space-y-1">
                                            <li>새 구글 스프레드시트를 만듭니다.</li>
                                            <li>첫 번째 행(A1~H1)에 헤더를 작성하세요: <br/>
                                                <span className="text-cyan-400">시간, 학번, 이름, 실험명, 설정, 결과, 퀴즈점수, 게임점수, 알게된점</span>
                                            </li>
                                        </ul>
                                    </div>

                                    <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                        <h4 className="font-bold text-white mb-2">2. 앱스 스크립트 작성</h4>
                                        <p className="mb-2">상단 메뉴 [확장 프로그램] > [Apps Script] 클릭 후 아래 코드를 모두 붙여넣으세요.</p>
                                        <div className="relative">
                                            <pre className="bg-black p-4 rounded-lg overflow-x-auto text-xs font-mono text-green-400">
{`function doPost(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var data = JSON.parse(e.postData.contents);
    
    sheet.appendRow([
      new Date(),
      data.studentId,
      data.studentName,
      data.experiment,
      data.setting,
      data.resultData,
      data.quizScore,
      data.gameScore,
      data.learningText
    ]);
    
    return ContentService.createTextOutput(JSON.stringify({"result":"success"}))
      .setMimeType(ContentService.MimeType.JSON);
  } catch(error) {
    return ContentService.createTextOutput(JSON.stringify({"result":"error", "error": error.toString()}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`}
                                            </pre>
                                        </div>
                                    </div>

                                    <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                        <h4 className="font-bold text-white mb-2">3. 배포 및 URL 적용</h4>
                                        <ul className="list-decimal list-inside space-y-1">
                                            <li>우측 상단 <b>[배포]</b> > <b>[새 배포]</b>를 클릭합니다.</li>
                                            <li>유형을 <b>[웹 앱]</b>으로 선택합니다.</li>
                                            <li>액세스 권한을 <b>[모든 사용자]</b>로 설정하고 배포합니다.</li>
                                            <li>생성된 <b>웹 앱 URL</b>을 복사합니다.</li>
                                            <li>이 HTML 파일의 54번째 줄 <code className="bg-slate-900 px-1 text-cyan-400">const GOOGLE_SCRIPT_URL = "";</code> 의 따옴표 사이에 복사한 URL을 넣고 저장하면 완료됩니다!</li>
                                        </ul>
                                    </div>
                                    <p className="text-center text-xs text-slate-500 pt-4 border-t border-slate-700 mt-6">Created by Yang DH</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
